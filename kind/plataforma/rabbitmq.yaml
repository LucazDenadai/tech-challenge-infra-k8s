# Broker único da Saga para os três serviços (ADR-017, ADR-018). Dados em emptyDir: demonstração (ADR-021).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: oficina-mecanica
  labels: { app: rabbitmq }
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: painel, containerPort: 15672 }
            # Plugin rabbitmq_prometheus da imagem oficial: filas e DLQs para o Prometheus (CARD-42b).
            - { name: metricas, containerPort: 15692 }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: plataforma-segredos, key: rabbitmq-usuario } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: plataforma-segredos, key: rabbitmq-senha } }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"] }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: dados, mountPath: /var/lib/rabbitmq }
      volumes:
        - name: dados
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: oficina-mecanica
spec:
  type: NodePort
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: painel, port: 15672, targetPort: painel, nodePort: 30672 }
    - { name: metricas, port: 15692, targetPort: metricas }
