# Coletor OTLP/HTTP e UI de traces da Saga (CARD-42). Armazenamento em memória: demonstração (ADR-021).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: oficina-mecanica
  labels: { app: jaeger }
spec:
  replicas: 1
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: ui, containerPort: 16686 }
          readinessProbe:
            httpGet: { path: /, port: 14269 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: oficina-mecanica
spec:
  type: NodePort
  selector: { app: jaeger }
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: ui, port: 16686, targetPort: ui, nodePort: 30686 }
