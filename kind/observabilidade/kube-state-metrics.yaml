# Estado dos Deployments do namespace oficina-mecanica para o alerta de deploy (CARD-42b).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: observabilidade
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-state-metrics-leitura
  namespace: oficina-mecanica
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-state-metrics-leitura
  namespace: oficina-mecanica
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: kube-state-metrics-leitura }
subjects:
  - { kind: ServiceAccount, name: kube-state-metrics, namespace: observabilidade }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: observabilidade
  labels: { app: kube-state-metrics }
spec:
  replicas: 1
  selector:
    matchLabels: { app: kube-state-metrics }
  template:
    metadata:
      labels: { app: kube-state-metrics }
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          args:
            - --namespaces=oficina-mecanica
            - --resources=deployments
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: observabilidade
spec:
  selector: { app: kube-state-metrics }
  ports:
    - { name: http, port: 8080, targetPort: http }
